[package]
name = "{{PACKAGE_NAME}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "{{PROJECT_NAME}}: a command-line tool with a terminal UI."
license = "MIT"

# The library half holds everything worth testing; the binary is a thin shell
# around it. Its name is fixed (the package name is not a valid identifier when
# it is hyphenated), so tests and the binary both say `use app::...`.
[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "{{PACKAGE_NAME}}"
path = "src/main.rs"

[dependencies]
# Error context a human can read: every failure carries the `.context(...)` of
# what the tool was trying to do.
anyhow = "1"
# The command-line surface. `derive` keeps the flags next to the types they
# fill; `env` lets any flag also come from the environment.
clap = { version = "4", features = ["derive", "env"] }
# Terminal control (raw mode, the alternate screen, key events) under ratatui.
# Pinned to the version ratatui builds against so the key types are the same.
crossterm = "0.28"
# The terminal UI. Immediate-mode rendering keeps the drawing code a pure
# function of the state it is handed.
ratatui = "0.29"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Help and about strings would render literal backticks in a terminal.
doc_markdown = "allow"
# A tool binary, not a published library surface: the error and panic sections
# would be ceremony no reader asked for.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
