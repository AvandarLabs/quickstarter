# What the terminal UI adds to the project type's manifest. Only the
# dependencies: everything else (the package, the lints, the release profile)
# belongs to the project type and is merged underneath this.

[dependencies]
# Terminal control: raw mode, the alternate screen, and the key events the
# keymap classifies. Pinned to the version ratatui builds against, so the
# `KeyEvent` this crate matches on is the one ratatui hands it.
crossterm = "0.29"
# The terminal UI. Immediate-mode rendering keeps drawing a pure function of
# the state it is handed, which is why `tui/render.rs` decides nothing.
ratatui = "0.30"
